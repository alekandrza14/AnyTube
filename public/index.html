<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnyTube — видео из GitHub</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<header>
  <a class="logo" href="/"><img src="/logo-emblem.png" alt="">Any<b>Tube</b></a>
  <form class="search" id="sf"><input id="q" placeholder="Поиск видео или автора"><button>🔍</button></form>
  <a class="btn ghost" href="/?kind=game">🎮 Игры</a>
  <a class="btn ghost" href="/wallpapers">🖼 Обои</a>
  <a class="btn ghost" href="/bux">💰 Букс</a>
  <a class="btn" href="/upload">＋ Загрузить</a>
</header>
<main>
  <div class="tabs" id="tabs"><a data-s="top">🔥 Топ</a><a data-s="new">🕒 Новые</a></div>
  <div class="tabs kinds" id="kinds"><a data-k="">Всё</a><a data-k="video">🎬 Видео</a><a data-k="app">📦 Приложения</a><a data-k="game">🎮 Игры</a><a data-k="model">🧊 3D-модели</a><a href="/wallpapers" data-k="wallpaper">🖼 Магазин обоев</a></div>
  <div class="status" id="status">Загружаем видео с GitHub…</div>
  <div class="grid" id="grid"></div>
</main>
<script src="/app.js"></script>
<script>
const p = new URLSearchParams(location.search);
const q = p.get("q") || "", author = p.get("author") || "", sort = p.get("sort") === "new" ? "new" : "top";
const kind = p.get("kind") || "";
for (const k of document.querySelectorAll("#kinds a:not([href='/wallpapers'])")) { const x = new URLSearchParams(p); k.dataset.k ? x.set("kind", k.dataset.k) : x.delete("kind"); k.href = "?" + x; if (k.dataset.k === kind) k.className = "on"; }
document.getElementById("q").value = q;
document.getElementById("sf").onsubmit = (e) => { e.preventDefault(); p.set("q", document.getElementById("q").value); location.search = p; };
for (const a of document.querySelectorAll("#tabs a")) {
  const s = new URLSearchParams(p); s.set("sort", a.dataset.s); a.href = "?" + s;
  if (a.dataset.s === sort) a.className = "on";
}
api(`/api/videos?q=${encodeURIComponent(q)}&author=${encodeURIComponent(author)}&sort=${sort}&kind=${encodeURIComponent(kind)}`).then((d) => {
  const st = document.getElementById("status");
  st.textContent = (author ? `Канал ${author} · ` : "") + `${d.count} видео` + (d.error ? ` · ошибка GitHub: ${d.error.slice(0,120)}` : "");
  const g = document.getElementById("grid");
  if (!d.videos.length) { g.outerHTML = `<div class="empty">Видео пока нет. <a class="btn" href="/upload">Загрузите первое</a></div>`; return; }
  g.innerHTML = d.videos.map(card).join("");
});
</script>
</body>
</html>
