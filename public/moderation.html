<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Модерация — AnyTube</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<header>
  <a class="logo" href="/"><img src="/logo-emblem.png" alt="">Any<b>Tube</b></a>
  <a class="btn ghost" href="/bux-admin">💰 Админка букса</a>
  <a class="btn ghost" href="/">← К видео</a>
</header>
<main class="bux">
  <h1>🛡 Модерация</h1>
  <div class="tabs" id="mtabs"><a data-t="pending">⏳ На проверке <span id="pendN"></span></a><a data-t="reports">⚠ Жалобы</a><a data-t="comments">💬 Комментарии</a><a data-t="banned">⛔ Блокировки</a><a data-t="shares">💰 Доли авторов</a><a data-t="mods" id="modsTab" hidden>🛡 Модераторы</a></div>
  <div id="root" class="status">Загрузка…</div>
</main>
<script src="/app.js"></script>
<script>
const post = (u, b) => fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }).then((r) => r.json());
const dt = (t) => new Date(t).toLocaleString("ru");
const watch = (id) => `/watch?v=${encodeURIComponent(id)}`;
let TAB = new URLSearchParams(location.search).get("tab") || "pending";
const root = document.getElementById("root");
const act = async (action, target, reportId, note) => {
  const r = await post("/api/mod/action", { action, target, reportId, note });
  if (r.error) return alert(r.error);
  show(TAB);
};
const btn = (label, action, target, reportId, cls = "ghost", confirmText) =>
  `<button class="btn ${cls} sm" data-a="${action}" data-t="${esc(target || "")}" data-r="${esc(reportId || "")}" ${confirmText ? `data-c="${esc(confirmText)}"` : ""}>${label}</button>`;
const bind = () => root.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => {
  if (b.dataset.c && !confirm(b.dataset.c)) return;
  act(b.dataset.a, b.dataset.t, b.dataset.r);
}));

async function show(t) {
  TAB = t;
  document.querySelectorAll("#mtabs a").forEach((a) => a.classList.toggle("on", a.dataset.t === t));
  const u = new URL(location); u.searchParams.set("tab", t); history.replaceState(null, "", u);
  root.className = "status"; root.textContent = "Загрузка…";
  if (t === "comments") return comments();
  if (t === "pending") return pending();
  if (t === "shares") return shares();
  if (t === "mods") return mods();
  const d = await api("/api/mod/reports");
  if (d.error) { root.innerHTML = `<div class="empty">${esc(d.error)}<br><br><a class="btn" href="/auth/login?back=/moderation">Войти через GitHub</a></div>`; return; }
  root.className = "";
  if (t === "banned") return banned(d);
  const fresh = d.reports.filter((r) => r.status === "new");
  root.innerHTML = `<p class="muted">Новых жалоб: <b>${fresh.length}</b>. Скрытое пропадает с сайта, файлы на GitHub не удаляются. Блокировка автора скрывает все его видео, комментарии и дизлайки и закрывает ему букс.</p>
    ${d.reports.length ? d.reports.map((r) => {
      const author = r.video?.owner || r.comment?.by || (r.type === "user" ? r.target : "");
      return `<div class="mod-card ${r.status !== "new" ? "done" : ""}">
        <div class="mod-head"><b>${{ video: "🎬 Видео", comment: "💬 Комментарий", user: "👤 Пользователь", other: "❓ Другое" }[r.type]}</b>
          <span class="mod-reason">${esc(r.reasonLabel || "")}</span>
          <span class="muted">${dt(r.t)} · от ${esc(r.by || "аноним")}${r.contact ? " · " + esc(r.contact) : ""}</span>
          <span class="mod-status">${{ new: "🆕 новая", resolved: "✅ решено", dismissed: "↩ отклонено" }[r.status]}</span></div>
        ${r.video ? `<p>Видео: <a href="${watch(r.video.id)}" target="_blank">${esc(r.video.title)}</a> · автор <b>${esc(r.video.owner)}</b> ${r.video.hidden ? "· <span class='muted'>уже скрыто</span>" : ""}</p>` : ""}
        ${r.comment ? `<p>Комментарий <b>${esc(r.comment.by)}</b> к <a href="${watch(r.comment.video)}" target="_blank">видео</a>: «${esc(r.comment.text)}» ${r.comment.hidden ? "· <span class='muted'>уже скрыт</span>" : ""}</p>` : ""}
        ${!r.video && !r.comment && r.target ? `<p>Объект: <code>${esc(r.target)}</code></p>` : ""}
        ${r.text ? `<p class="mod-text">${esc(r.text)}</p>` : ""}
        ${r.status === "new" ? `<div class="bk-row">
          ${r.video && !r.video.hidden ? btn("🙈 Скрыть видео", "hideVideo", r.video.id, r.id, "") : ""}
          ${r.comment && !r.comment.hidden ? btn("🙈 Скрыть комментарий", "hideComment", r.comment.id, r.id, "") : ""}
          ${author ? btn(`⛔ Заблокировать ${esc(author)}`, "ban", author, r.id, "danger", `Заблокировать ${author}? Скроются все его видео, комментарии и дизлайки, букс будет закрыт.`) : ""}
          ${btn("✅ Решено", "resolve", "", r.id)} ${btn("↩ Отклонить жалобу", "dismiss", "", r.id)}
        </div>` : `<p class="muted">${r.done ? `обработал ${esc(r.done.by)} ${dt(r.done.t)}` : ""}</p>`}
      </div>`; }).join("") : `<div class="empty">Жалоб пока нет 🎉</div>`}`;
  bind();
}
async function comments() {
  const d = await api("/api/mod/comments");
  if (d.error) { root.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  root.className = "";
  root.innerHTML = `<p class="muted">Последние комментарии со всего сайта.</p>
    <table class="bx-table"><tr><th>Дата</th><th>Автор</th><th>Текст</th><th>Видео</th><th></th></tr>
    ${d.comments.map((c) => `<tr class="${c.hidden || c.banned ? "muted" : ""}"><td>${dt(c.created)}</td><td><b>${esc(c.by)}</b>${c.banned ? " ⛔" : ""}</td>
      <td class="bx-text">${esc(c.text)}</td><td><a href="${watch(c.video)}" target="_blank">${esc(c.videoTitle)}</a></td>
      <td>${c.hidden ? btn("Вернуть", "unhideComment", c.id) : btn("🙈 Скрыть", "hideComment", c.id, "", "")}
        ${c.banned ? "" : btn("⛔", "ban", c.by, "", "danger", `Заблокировать ${c.by}?`)}</td></tr>`).join("") || `<tr><td colspan="5">Комментариев нет.</td></tr>`}</table>`;
  bind();
}
const R = (k) => (k / 100).toFixed(2).replace(".", ",").replace(",00", "") + " ₽";
async function pending() {
  const d = await api("/api/mod/pending");
  if (d.error) { root.innerHTML = `<div class="empty">${esc(d.error)}<br><br><a class="btn" href="/auth/login?back=/moderation">Войти через GitHub</a></div>`; return; }
  root.className = "";
  document.getElementById("pendN").textContent = d.pending.length ? `(${d.pending.length})` : "";
  const kind = (v) => ({ app: "📦 Приложение", wallpaper: "🖼 Обои" }[v.kind] || "🎬 Видео") + (v.sale ? ` · 💰 ${v.sale.per_hour ? R(v.sale.per_hour) + "/час" : v.sale.buy ? R(v.sale.buy) : "подписка"}` : "");
  root.innerHTML = `
    ${d.enabled ? "" : `<div class="note">Премодерация выключена (PREMODERATION=off) — новые видео публикуются сразу.</div>`}
    <p class="muted">Новые видео не видны в ленте, поиске, обоях и буксе, пока вы их не одобрите. Автор видит своё видео по ссылке с пометкой «на проверке».</p>
    ${d.pending.length ? `<div class="mod-grid">${d.pending.map((v) => `
      <div class="mod-card mod-video">
        <video src="${esc(v.src)}" controls preload="metadata" muted></video>
        <div><b>${esc(v.title)}</b><br><span class="muted">${esc(v.owner)} · ${kind(v)} · ${fmtDur(v.duration)} · загружено ${dt(v.created)}</span><br>
          <a href="${watch(v.id)}" target="_blank">открыть страницу</a> · <a href="${esc(v.repoUrl)}" target="_blank">репозиторий</a></div>
        <div class="bk-row">
          ${btn("✅ Одобрить", "approve", v.id, "", "")}
          <button class="btn ghost sm" data-rej="${esc(v.id)}">❌ Отклонить</button>
          ${btn(`⭐ Доверять ${esc(v.owner)}`, "trust", v.owner, "", "ghost", `Доверять ${v.owner}? Его новые видео будут публиковаться без проверки (это видео тоже).`)}
          ${btn("⛔ Заблокировать автора", "ban", v.owner, "", "danger", `Заблокировать ${v.owner}?`)}
        </div>
      </div>`).join("")}</div>` : `<div class="empty">Очередь пуста — все видео проверены 🎉</div>`}
    ${d.rejected.length ? `<section class="bx-box"><h2>❌ Отклонённые</h2><table class="bx-table">${d.rejected.map((v) => `<tr><td><a href="${watch(v.id)}" target="_blank">${esc(v.title)}</a></td>
      <td>${esc(v.owner)}</td><td>${esc(v.reason || "")}</td><td>${dt(v.t)}</td><td>${btn("✅ Всё-таки одобрить", "approve", v.id)}</td></tr>`).join("")}</table></section>` : ""}
    ${d.trusted.length ? `<section class="bx-box"><h2>⭐ Доверенные авторы</h2><p class="muted">Их видео публикуются без проверки.</p>
      <table class="bx-table">${d.trusted.map((t) => `<tr><td>${esc(t.login)}</td><td>${dt(t.t)}</td><td>${btn("Убрать доверие", "untrust", t.login)}</td></tr>`).join("")}</table></section>` : ""}`;
  bind();
  root.querySelectorAll("[data-rej]").forEach((b) => (b.onclick = () => {
    const why = prompt("Причина отклонения (увидит только автор):", "Нарушение правил AnyTube");
    if (why !== null) act("reject", b.dataset.rej, "", why);
  }));
}
function banned(d) {
  root.innerHTML = `<section class="bx-box"><h2>⛔ Заблокировать автора вручную</h2>
      <form class="form bx-inline" id="bf"><input name="login" placeholder="ник на GitHub" required><input name="note" placeholder="причина"><button class="btn danger">Заблокировать</button></form></section>
    <section class="bx-box"><h2>Заблокированные авторы</h2>
      ${d.banned.length ? `<table class="bx-table"><tr><th>Ник</th><th>Когда</th><th>Причина</th><th></th></tr>${d.banned.map((b) => `<tr><td><a href="https://github.com/${esc(b.login)}" target="_blank">${esc(b.login)}</a></td>
        <td>${dt(b.t)}</td><td>${esc(b.note || "")}</td><td>${btn("Разблокировать", "unban", b.login)}</td></tr>`).join("")}</table>` : `<p class="muted">Никто не заблокирован.</p>`}
    </section>
    <section class="bx-box"><h2>Скрытые комментарии</h2>
      ${d.hiddenComments.length ? `<table class="bx-table">${d.hiddenComments.map((h) => `<tr><td><code>${esc(h.id)}</code></td><td>${dt(h.t)}</td><td>${btn("Вернуть", "unhideComment", h.id)}</td></tr>`).join("")}</table>` : `<p class="muted">Нет.</p>`}
      <p class="muted">Скрытые видео и дубли — в <a href="/bux-admin">админке букса</a>.</p>
    </section>`;
  bind();
  const bf = document.getElementById("bf");
  bf.onsubmit = (e) => { e.preventDefault(); if (confirm(`Заблокировать ${bf.login.value}?`)) act("ban", bf.login.value.trim(), "", bf.note.value); };
}
// ── доли авторов: сколько процентов от денег покупателя получает автор ──
async function shares(prefill) {
  const d = await api("/api/mod/shares");
  if (d.error) { root.innerHTML = `<div class="empty">${esc(d.error)}<br><br><a class="btn" href="/auth/login?back=/moderation?tab=shares">Войти через GitHub</a></div>`; return; }
  root.className = "";
  document.getElementById("modsTab").hidden = !d.me.admin;
  const max = d.me.admin ? d.adminMax : d.modMax;
  const presets = [[d.base, "обычная"], [d.base + 15, "партнёр"], [88, ""], [d.verified, "проверенный"], [d.base + 50, "легенда, минус для платформы"]]
    .filter(([p], i, a) => p <= max && a.findIndex(([q]) => q === p) === i);
  const sign = (n) => (n > 0 ? "+" : "") + n;
  const src = (a) => a.source === "set" ? `назначил ${esc(a.by)}: «${esc(a.reason)}»` : { base: "обычная ставка", verified: "проверенный автор (автоматически 90%)", mod: "модератор (автоматически 90%)", owner: "владелец сайта" }[a.source];
  root.innerHTML = `
    <section class="bx-box">
      <h2>Назначить долю автора</h2>
      <p class="muted">Доля — сколько процентов от денег покупателя получает автор (продажи, подписки, поминутные просмотры и игры).
        Обычная ставка — <b>${d.base}%</b> (комиссия AnyTube ${100 - d.base}%). Проверенные авторы и модераторы автоматически получают <b>${d.verified}%</b>.
        ${d.me.admin ? `<br>⚠ Больше 100% — <b>отрицательная комиссия</b>: AnyTube доплачивает автору из своих денег. Только для самых крутых.` : `<br>Вы можете назначать до ${d.modMax}%. Больше — только администратор.`}</p>
      <form class="form" id="sf">
        <input name="login" list="authorsList" placeholder="ник автора на GitHub" required value="${esc(prefill || "")}">
        <datalist id="authorsList">${d.authors.map((a) => `<option value="${esc(a.login)}">`).join("")}</datalist>
        <div class="shop-row">${presets.map(([p, n]) => `<button type="button" class="btn ghost sm" data-p="${p}">${p}% · ${sign(p - d.base)}%${n ? " · " + n : ""}</button>`).join("")}
          <button type="button" class="btn ghost sm" data-p="auto">↺ автоматически</button></div>
        <label>Доля автора, % <input name="pct" type="number" min="0" max="${max}" step="1" placeholder="например 90"></label>
        <p class="muted" id="sfHint"></p>
        <textarea name="reason" rows="2" placeholder="Обоснование: почему этому автору такая ставка (обязательно)" required></textarea>
        <button class="btn">Сохранить ставку</button> <span id="sfMsg" class="muted"></span>
      </form>
    </section>
    <section class="bx-box"><h2>Авторы (${d.authors.length})</h2>
      <table class="bx-table"><tr><th>Автор</th><th>Доля</th><th>Почему</th><th>Товаров</th><th></th></tr>
      ${d.authors.map((a) => `<tr><td>${a.avatar ? `<img src="${esc(a.avatar)}&s=40" alt="" style="width:22px;height:22px;border-radius:50%;vertical-align:middle"> ` : ""}<a href="/?author=${encodeURIComponent(a.login)}" target="_blank">${esc(a.login)}</a></td>
        <td>${shareChip(a.pct, a.tier, a.diff)} <span class="muted">${esc(a.tier)}${a.diff ? " · " + sign(a.diff) + "%" : ""}</span></td>
        <td class="muted">${src(a)}</td><td>${a.items}${a.paid ? ` (платных ${a.paid})` : ""}</td>
        <td>${a.source === "owner" ? "" : `<button class="btn ghost sm" data-edit="${esc(a.login)}">Изменить</button>`}</td></tr>`).join("")}</table></section>
    ${d.log.length ? `<section class="bx-box"><h2>История ставок</h2><table class="bx-table">${d.log.map((x) => `<tr><td>${dt(x.t)}</td><td><b>${esc(x.login)}</b></td>
      <td>${x.from}% → ${x.to}%${x.auto ? " (авто)" : ""}</td><td class="muted">${esc(x.by)}: «${esc(x.reason)}»</td></tr>`).join("")}</table></section>` : ""}`;
  const f = document.getElementById("sf");
  const hint = () => { const p = Number(f.pct.value); document.getElementById("sfHint").textContent = f.pct.value === "" ? "" :
    `Автор получит ${p}% · комиссия AnyTube ${100 - p}%${p > 100 ? " (платформа доплачивает " + (p - 100) + "% из своих)" : ""} · ${sign(p - d.base)}% к обычной ставке`; };
  f.pct.oninput = hint;
  let auto = false;
  f.querySelectorAll("[data-p]").forEach((b) => (b.onclick = () => { auto = b.dataset.p === "auto"; f.pct.value = auto ? "" : b.dataset.p; hint(); if (auto) document.getElementById("sfHint").textContent = "Вернуть ставку по правилам: обычная / проверенный / модератор"; }));
  root.querySelectorAll("[data-edit]").forEach((b) => (b.onclick = () => { f.login.value = b.dataset.edit; f.scrollIntoView({ behavior: "smooth" }); f.pct.focus(); }));
  f.onsubmit = async (e) => {
    e.preventDefault();
    const p = auto ? "auto" : f.pct.value;
    if (p === "") return alert("Выберите долю или «автоматически»");
    if (Number(p) > 100 && !confirm(`Ставка ${p}% — отрицательная комиссия: AnyTube будет доплачивать ${f.login.value} ${Number(p) - 100}% с каждой продажи из своих денег. Точно?`)) return;
    const r = await post("/api/mod/share", { login: f.login.value.trim(), pct: p, reason: f.reason.value });
    if (r.error) return (document.getElementById("sfMsg").textContent = "❌ " + r.error);
    shares();
  };
}
// ── модераторы (только администратор) ──
async function mods() {
  const d = await api("/api/mod/shares");
  if (d.error || !d.me.admin) { root.innerHTML = `<div class="empty">${esc(d.error || "Только для администратора")}</div>`; return; }
  root.className = "";
  document.getElementById("modsTab").hidden = false;
  root.innerHTML = `<section class="bx-box"><h2>Назначить модератора</h2>
      <p class="muted">Модератор входит на сайт через GitHub и видит эту страницу. Модераторы автоматически получают долю ${d.verified}%.</p>
      <form class="form" id="mf"><input name="login" placeholder="ник на GitHub" required>
        <label><input type="checkbox" name="content" checked> 🛡 Контент: проверка новых видео, жалобы, скрытие, блокировки</label>
        <label><input type="checkbox" name="shares"> 💰 Доли авторов: ставки до ${d.modMax}% и «проверенные авторы»</label>
        <button class="btn">Сохранить</button></form></section>
    <section class="bx-box"><h2>Модераторы (${d.mods.length})</h2>
      ${d.mods.length ? `<table class="bx-table"><tr><th>Ник</th><th>Права</th><th>С какого</th><th></th></tr>${d.mods.map((m) => `<tr><td><b>${esc(m.login)}</b></td>
        <td>${[m.content && "🛡 контент", m.shares && "💰 доли"].filter(Boolean).join(", ") || "—"}</td><td>${dt(m.t)}</td>
        <td><button class="btn ghost sm" data-ed="${esc(m.login)}" data-c="${m.content ? 1 : ""}" data-s="${m.shares ? 1 : ""}">Изменить</button>
        <button class="btn danger sm" data-rm="${esc(m.login)}">Снять</button></td></tr>`).join("")}</table>` : `<p class="muted">Пока никого.</p>`}</section>`;
  const f = document.getElementById("mf");
  f.onsubmit = async (e) => { e.preventDefault(); const r = await post("/api/mod/mods", { login: f.login.value.trim(), content: f.content.checked, shares: f.shares.checked }); if (r.error) return alert(r.error); mods(); };
  root.querySelectorAll("[data-ed]").forEach((b) => (b.onclick = () => { f.login.value = b.dataset.ed; f.content.checked = !!b.dataset.c; f.shares.checked = !!b.dataset.s; }));
  root.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = async () => { if (!confirm(`Снять ${b.dataset.rm} с модерации?`)) return; await post("/api/mod/mods", { login: b.dataset.rm, remove: true }); mods(); }));
}
document.querySelectorAll("#mtabs a").forEach((a) => (a.onclick = () => show(a.dataset.t)));
api("/api/bux/me").then((m) => { if (m.user?.admin) document.getElementById("modsTab").hidden = false; });
show(TAB);
</script>
</body>
</html>
