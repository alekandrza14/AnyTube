<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnyTube — просмотр</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<header>
  <a class="logo" href="/"><img src="/logo-emblem.png" alt="">Any<b>Tube</b></a>
  <form class="search" action="/"><input name="q" placeholder="Поиск видео или автора"><button>🔍</button></form>
  <a class="btn ghost" href="/bux">💰 Букс</a>
  <a class="btn" href="/upload">＋ Загрузить</a>
</header>
<main class="watch">
  <section class="player" id="player"><div class="status">Загрузка…</div></section>
  <aside class="side" id="side"></aside>
</main>
<script src="/app.js"></script>
<script src="/shop.js"></script>
<script>
const id = new URLSearchParams(location.search).get("v");
api("/api/video?id=" + encodeURIComponent(id)).then((v) => {
  const el = document.getElementById("player");
  if (v.error) { el.innerHTML = `<div class="empty">${esc(v.error)}</div>`; return; }
  document.title = v.title + " — AnyTube";
  const parts = v.parts && v.parts.length ? v.parts : [{ n: 1, src: v.src, duration: 0 }];
  const multi = parts.length > 1;
  el.innerHTML = `
    <video id="vid" src="${esc(parts[0].src)}" controls autoplay playsinline></video>
    ${multi ? `<div class="parts">
      <div class="parts-head"><b id="partNow">Часть 1 из ${parts.length}</b>
        <span class="muted">· всего ${fmtDur(v.duration)} · части играют подряд автоматически</span></div>
      <div class="parts-list">${parts.map((p, i) => `<button data-i="${i}" class="${i ? "" : "on"}">${p.n}${p.duration ? `<small>${fmtDur(p.duration)}</small>` : ""}</button>`).join("")}</div>
    </div>` : ""}
    <h1>${esc(v.title)}</h1>
    <div class="row">
      <a class="author" href="/?author=${encodeURIComponent(v.owner)}"><img src="${esc(v.avatar)}&s=80" alt="">
        <div><b>${esc(v.owner)}</b><br><span style="color:var(--muted)">${esc(v.repo)}</span></div></a>
      <div style="display:flex;gap:8px">
        <a class="btn" id="dl" href="${esc(parts[0].src)}?download=1">⬇ Скачать${v.trailer ? " трейлер" : multi ? " часть 1" : ""}</a>
        <a class="btn ghost" href="${esc(v.repoUrl)}" target="_blank" rel="noopener">GitHub ★ ${v.stars}</a>
        <button class="btn ghost" onclick="navigator.clipboard.writeText(location.href);this.textContent='Скопировано'">🔗 Поделиться</button>
      </div>
    </div>
    <p style="color:var(--muted)">Файл: ${esc(v.path)}${multi ? ` · ${parts.length} частей` : ""} · обновлено ${ago(v.updated)}</p>
    <section class="shop" id="shop"></section>
    <div class="promo"><a class="btn promo-btn" href="/bux?tab=ads&video=${encodeURIComponent(v.id)}">📢 Продвинуть в буксе</a>
      <span class="muted">Автор может запустить рекламу видео, зрители смотрят и зарабатывают. <a href="/bux">Заработать на просмотрах →</a></span></div>
    <section class="dislikes">
      <div class="dl-head"><b>👎 Дизлайки: ${v.dislikes.total}</b>
        ${v.dislikes.total ? `<span class="muted">· средний уровень ${v.dislikes.avg} из 5</span>` : ""}</div>
      ${["😕", "😒", "👎", "😖", "🤮"].map((e, i) => {
        const n = v.dislikes.levels[i], max = Math.max(1, ...v.dislikes.levels);
        return `<div class="dl-row"><span class="dl-lbl">${e} ${i + 1} · ${esc(v.dislikeLabels[i])}</span>
          <span class="dl-bar"><i class="l${i + 1}" style="width:${(n / max) * 100}%"></i></span><span class="dl-n">${n}</span></div>`;
      }).join("")}
      <div class="muted dl-how">Поставить дизлайк: <a href="/AnyTube-Uploader.zip">AnyTube Uploader</a> → «Поставить дизлайк» → ссылка на это видео → уровень 1–5.</div>
    </section>
    <section class="desc">
      <div class="muted"><b style="color:var(--text)">📝 Описание</b>${v.descChars ? ` · ${Number(v.descChars).toLocaleString("ru")} символов` : ""}</div>
      ${v.descChunks ? `<div id="descText"></div><button class="btn ghost" id="descMore">Загрузка…</button>`
        : `<p class="muted" style="margin:8px 0 0">Описания пока нет. Чтобы добавить, положите в репозиторий
            <a href="${esc(v.repoUrl)}" target="_blank" rel="noopener" style="color:var(--accent2)">${esc(v.repo)}</a>
            файл <code>description.txt</code> (до 1 000 000 000 символов, длинное можно разбить на <code>description.part0001.txt</code>, <code>part0002</code>…).</p>`}
    </section>
    <section class="comments">
      <h2>Комментарии (${v.comments.length})</h2>
      <div class="howto">Чтобы написать комментарий, откройте
        <a href="/AnyTube-Uploader.zip">AnyTube Uploader</a> → «Написать комментарий» и вставьте ссылку на это видео.
        <button class="btn ghost" onclick="navigator.clipboard.writeText(location.href);this.textContent='Ссылка скопирована'">Скопировать ссылку</button>
      </div>
      ${v.comments.map((c) => `
        <div class="comment"><img src="${esc(c.avatar)}&s=72" alt="" loading="lazy">
          <div><b>${esc(c.by)}</b> <span class="muted">· ${ago(c.created)} · <a href="${esc(c.url)}" target="_blank" rel="noopener">№${c.num} на GitHub</a></span>
            <p>${esc(c.text) || '<span class="muted">(текст в comment.md)</span>'}</p></div>
        </div>`).join("") || '<p class="muted">Пока никто не комментировал.</p>'}
    </section>`;

  shopInit(v);

  // ---- части большого видео: следующая включается сама ----
  if (multi) {
    const vid = document.getElementById("vid"), btns = [...document.querySelectorAll(".parts-list button")];
    let cur = 0;
    const go = (i, play = true) => {
      if (i < 0 || i >= parts.length) return;
      cur = i;
      vid.src = parts[i].src;
      if (play) vid.play().catch(() => {});
      btns.forEach((b, k) => b.classList.toggle("on", k === i));
      btns[i].scrollIntoView({ block: "nearest", inline: "center" });
      document.getElementById("partNow").textContent = `Часть ${i + 1} из ${parts.length}`;
      const dl = document.getElementById("dl");
      dl.href = parts[i].src + "?download=1";
      dl.textContent = `⬇ Скачать часть ${i + 1}`;
    };
    vid.addEventListener("ended", () => go(cur + 1));
    btns.forEach((b) => (b.onclick = () => go(Number(b.dataset.i))));
    // заранее подгружаем начало следующей части, чтобы переход был без паузы
    vid.addEventListener("timeupdate", () => {
      if (vid.duration && vid.duration - vid.currentTime < 15 && parts[cur + 1] && !parts[cur + 1].pre) {
        parts[cur + 1].pre = true;
        fetch(parts[cur + 1].src, { headers: { Range: "bytes=0-1048575" } }).catch(() => {});
      }
    });
  }

  // ---- описание: грузится порциями, хоть 1 000 000 000 символов ----
  if (v.descChunks) {
    const box = document.getElementById("descText"), more = document.getElementById("descMore");
    let next = { n: 0, offset: 0 };
    const load = async () => {
      if (!next) return;
      more.disabled = true; more.textContent = "Загрузка…";
      const d = await api(`/api/desc?id=${encodeURIComponent(v.id)}&n=${next.n}&offset=${next.offset}`);
      if (d.error) { more.textContent = d.error; return; }
      box.append(document.createTextNode(d.text));
      next = d.next;
      more.disabled = false;
      more.style.display = next ? "" : "none";
      more.textContent = `Показать ещё (файл ${next ? next.n + 1 : d.chunks} из ${d.chunks})`;
    };
    more.onclick = load;
    load();
  }
  api("/api/videos").then((d) => {
    document.getElementById("side").innerHTML = d.videos.filter((x) => x.id !== v.id).slice(0, 20).map(card).join("");
  });
});
</script>
</body>
</html>
