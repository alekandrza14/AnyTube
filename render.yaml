services:
  - type: web
    name: anytube
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: CACHE_MINUTES
        value: "10"
      - key: NODE_VERSION
        value: "20"
      - key: SITE_URL           # адрес сайта (для входа и возврата после оплаты)
        value: https://anytube.onrender.com
      # ── Букс ──
      - key: GITHUB_CLIENT_ID   # OAuth App на GitHub (вход на сайт)
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET     # Render сгенерирует сам
        generateValue: true
      - key: DB_REPO            # ПРИВАТНЫЙ репозиторий для базы, например alekandrza14/anytube-db
        sync: false
      - key: DB_TOKEN           # токен с правом записи только в DB_REPO
        sync: false
      - key: YOOMONEY_WALLET    # кошелёк ЮMoney, на который пополняют рекламу
        sync: false
      - key: YOOMONEY_SECRET    # секрет HTTP-уведомлений ЮMoney
        sync: false
      - key: ADMIN_LOGIN
        value: alekandrza14
      - key: PAYOUT_EMAIL       # куда приходят заявки на вывод
        value: alekandrza14@gmail.com
      - key: CONTACT_EMAIL      # почта для жалоб и нарушений (подвал сайта, страница /report)
        value: alekandrza14@gmail.com
      - key: CONTACT_PHONE      # телефон для жалоб и нарушений
        value: "+79087029462"
      - key: PREMODERATION      # on — новые видео ждут одобрения администратора, off — публикуются сразу
        value: "on"
      - key: BUX_COMMISSION     # доля AnyTube с каждого просмотра (0.25 = 25%)
        value: "0.25"
      # ── Магазин и СБП ──
      - key: PAID_TOKEN         # classic-токен аккаунта alekandrza14 с галочкой repo (читает платные приватные репо)
        sync: false
      - key: SALE_COMMISSION    # обычная доля AnyTube с продаж (0.37 = 37%, автор получает 63%; проверенные и модераторы — 90%)
        value: "0.37"
      - key: SBP_PHONE          # номер для пополнения по СБП, например +7 900 123-45-67
        sync: false
      - key: SBP_BANK           # банк получателя, например Т-Банк
        sync: false
      - key: SBP_NAME           # имя получателя, например Александр А.
        sync: false
